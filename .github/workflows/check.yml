name: check
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn run check
        env:
          # main (or a PR into main) builds the live site, everything else the test site (src/config/env.ts)
          SITE_ENV: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && 'live' || 'dev' }}
